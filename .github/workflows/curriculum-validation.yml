name: Curriculum Validation

on:
  push:
    branches:
      - master
      - 'work/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run deterministic maintenance checks
        run: python3 00_Index/_Repository_Inventory/maintenance_checks.py .
